name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Android
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Restaurar Keystore desde GitHub Secrets
      - name: Restore Android Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keys
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keys/habittracker.jks

      # 6. Comprobar Keystore
      - name: Verify Keystore
        run: |
          test -s keys/habittracker.jks

      # 7. Permisos Gradle
      - name: Grant execute permission
        run: chmod +x gradlew

      # 8. Ejecutar tests
      - name: Run tests
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test

      # 9. Generar APK Release
      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 10. Generar AAB Release
      - name: Build AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # 11. Guardar mapping de R8
      - name: Upload R8 Mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # 12. Publicar GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HabitTracker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab